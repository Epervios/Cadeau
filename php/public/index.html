<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa - Accueil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="snowflakes" id="snowflakes"></div>
    
    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="gift-icon">🎁</span>
                <span class="sparkle-icon">✨</span>
            </div>
            <h1 class="title">Secret Santa</h1>
            <p class="subtitle">Tirage au sort familial pour Noël</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 id="formTitle">Connexion</h2>
                <p id="formDescription">Connectez-vous pour voir votre attribution</p>
            </div>
            
            <div class="tabs">
                <button class="tab active" onclick="showLogin()">Connexion</button>
                <button class="tab" onclick="showRegister()">Inscription</button>
            </div>

            <!-- Formulaire de connexion -->
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mot de passe</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>

            <!-- Formulaire d'inscription -->
            <form id="registerForm" class="form hidden">
                <div class="form-group">
                    <label for="register-name">Prénom</label>
                    <input type="text" id="register-name" name="first_name" placeholder="Jean" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Mot de passe</label>
                    <input type="password" id="register-password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-success">S'inscrire</button>
            </form>

            <div id="message" class="message hidden"></div>
        </div>

        <p class="footer">🎄 Joyeux Noël! 🎅</p>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
